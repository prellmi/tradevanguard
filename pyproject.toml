[project]
name = "tradevanguard"
version = "0.1.0"
description = "Find EVE Online trade opportunities from ESI market data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.3",
    "httpx>=0.28",
    "uvicorn>=0.54.0",
]

[project.scripts]
tradevanguard = "tradevanguard.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
